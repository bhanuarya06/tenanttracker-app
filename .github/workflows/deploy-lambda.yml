name: Deploy to Lambda

on:
  push:
    branches:
      - stableVersion
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  SAM_STACK_NAME: tenanttracker-lambda

jobs:
  deploy:
    name: Build and Deploy (Lambda + CloudFront)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── Install backend dependencies ───────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # ── SAM build ──────────────────────────────────────────────────────────
      - name: SAM build
        run: sam build --config-file samconfig.toml

      # ── SAM deploy ─────────────────────────────────────────────────────────
      - name: SAM deploy
        run: |
          sam deploy \
            --config-file samconfig.toml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # ── Read stack outputs ─────────────────────────────────────────────────
      - name: Read CloudFormation stack outputs
        id: stack
        run: |
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name $SAM_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucket'].OutputValue" \
            --output text)

          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name $SAM_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue" \
            --output text)

          CF_DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${CF_DOMAIN}'].Id" \
            --output text)

          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "cf_domain=$CF_DOMAIN"             >> $GITHUB_OUTPUT
          echo "cf_dist_id=$CF_DIST_ID"           >> $GITHUB_OUTPUT
          echo "CloudFront: https://$CF_DOMAIN"

      # ── Build frontend ─────────────────────────────────────────────────────
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}

      # ── Deploy frontend to S3 ──────────────────────────────────────────────
      - name: Sync frontend assets to S3 (long-cached)
        run: |
          aws s3 sync frontend/dist/ s3://${{ steps.stack.outputs.frontend_bucket }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html to S3 (no-cache)
        run: |
          aws s3 cp frontend/dist/index.html \
            s3://${{ steps.stack.outputs.frontend_bucket }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      # ── Invalidate CloudFront ──────────────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.cf_dist_id }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Lambda deployed: $SAM_STACK_NAME"
          echo "🌍 CloudFront URL: https://${{ steps.stack.outputs.cf_domain }}"
          echo "   → Point tenanttracker.online CNAME to ${{ steps.stack.outputs.cf_domain }}"
