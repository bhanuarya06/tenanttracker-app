AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TenantTracker — Lambda + API Gateway + EventBridge (CloudFront deployed separately)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures: [x86_64]
    Environment:
      Variables:
        NODE_ENV: production
        CORS_ORIGIN: https://tenanttracker.online
        FRONTEND_URL: https://tenanttracker.online

Resources:

  # ── S3: file uploads (public-read so images work without CloudFront) ────────
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub tenanttracker-uploads-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins:
              - https://tenanttracker.online
              - http://localhost:5173
            MaxAge: 3600

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${UploadsBucket.Arn}/*

  # ── S3: React frontend static site (used when CloudFront is added later) ───
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub tenanttracker-frontend-${AWS::AccountId}

  # ── API Gateway HTTP API ────────────────────────────────────────────────────
  TenantTrackerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: tenanttracker-api
      CorsConfiguration:
        AllowOrigins:
          - https://tenanttracker.online
          - http://localhost:5173
        AllowHeaders:
          - Content-Type
          - Authorization
          - Cookie
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        AllowCredentials: true
        MaxAge: 300

  # ── Lambda: main Express API ────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tenanttracker-api
      Handler: src/lambda.handler
      CodeUri: backend/
      Description: TenantTracker Express API (serverless)
      Environment:
        Variables:
          UPLOADS_BUCKET: !Ref UploadsBucket
          AWS_UPLOADS_REGION: !Ref AWS::Region
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref TenantTrackerApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref TenantTrackerApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tenanttracker/*
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub ${UploadsBucket.Arn}/*

  # ── Lambda: bill cron (replaces node-cron) ──────────────────────────────────
  BillCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tenanttracker-bill-cron
      Handler: src/cron/billHandler.handler
      CodeUri: backend/
      Description: Generate monthly draft bills on the 1st of each month
      Timeout: 300
      Events:
        MonthlySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 18 1 * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Name: tenanttracker-monthly-billing
            Description: Runs at midnight IST on the 1st of every month
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tenanttracker/*
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'

Outputs:
  ApiEndpoint:
    Description: API Gateway HTTP API endpoint URL
    Value: !Sub https://${TenantTrackerApi}.execute-api.${AWS::Region}.amazonaws.com

  UploadsBucket:
    Description: S3 bucket for user-uploaded files
    Value: !Ref UploadsBucket

  FrontendBucket:
    Description: S3 bucket — deploy React dist/ here, then add CloudFront
    Value: !Ref FrontendBucket
