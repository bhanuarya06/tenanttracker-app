server {
  listen 80;
  server_name _;

  client_max_body_size 10M;

  # SPA auth callback routes
  location ~ ^/auth/callback/ {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # In ECS the backend container shares the same task network, so proxy to localhost
  location /api/ {
    proxy_pass http://localhost:5001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location /auth/ {
    proxy_pass http://localhost:5001/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /oauth/ {
    proxy_pass http://localhost:5001/oauth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://localhost:5001/uploads/;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://localhost:5001/health;
  }

  location /.well-known/ {
    proxy_pass http://localhost:5001/.well-known/;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
